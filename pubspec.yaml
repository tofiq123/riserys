name: rise
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Localization infrastructure. flutter_localizations supplies the global
  # Material/Widgets/Cupertino delegates; intl backs the generated
  # AppLocalizations. See l10n.yaml + lib/l10n/ (scaffolding only — existing
  # UI strings are not yet migrated; see docs/l10n.md).
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.1
  timezone: ^0.10.1
  flutter_riverpod: ^2.6.1
  collection: ^1.19.1
  flutter_timezone: ^5.1.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.16.0
  google_sign_in: ^7.2.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  url_launcher: ^6.3.2

  # Device-sensor dismiss missions (Phase 9B). sensors_plus: accelerometer for
  # the shake mission (no permission). mobile_scanner: camera QR scan (CAMERA
  # permission + NSCameraUsageDescription). pedometer: step stream for the walk
  # mission (ACTIVITY_RECOGNITION permission + NSMotionUsageDescription).
  sensors_plus: ^6.1.1
  mobile_scanner: ^5.2.3
  pedometer: ^4.0.2
  share_plus: ^12.0.2

  # Camera-based dismiss missions (Phase camera-missions). camera: live preview
  # + still capture for the photo-match ("snap a spot") mission and the
  # eye-open mission's front-camera feed (CAMERA permission +
  # NSCameraUsageDescription — both already present).
  # google_mlkit_face_detection: on-device face + eye-open classification for
  # the eye-open ("prove you're really up") mission. NOTE for the Mac pass:
  # this raises the iOS min deployment target to 15.5 (Podfile is already at
  # 16.0, so no change needed) and pulls the GoogleMLKit pods.
  camera: ^0.12.0+1
  google_mlkit_face_detection: ^0.14.0

  # Reads Build.MANUFACTURER for the Setup Guardian's OEM-aware battery
  # guidance (Phase 12). No runtime permission required.
  device_info_plus: ^11.5.0
  purchases_flutter: ^10.4.2
  screen_brightness: ^2.1.11
  record: ^6.2.1
  just_audio: ^0.10.6

  # Pure-Dart image decode/resize/grayscale for the photo-match mission's
  # perceptual (average) hash — see lib/domain/photo_match.dart. Also used
  # dev-only by tool/gen_icon.dart to draw the source launcher icon.
  image: ^4.3.0

  # Deep links (rise://invite/<CODE> group invites): delivers the launching
  # link and links tapped while the app runs to Dart — see
  # lib/data/invite_links.dart. (6.x is the newest compatible with this
  # Flutter/Dart pin; 7.x needs Dart >=3.12.)
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.15.1
  pigeon: ^26.3.4
  sqlite3: ^2.4.0

  # Generates the platform launcher-icon assets from the source PNGs.
  # Config lives in the top-level `flutter_launcher_icons:` section below.
  # (The `image` package it uses is now a normal dependency — see above.)
  flutter_launcher_icons: ^0.14.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generate the localized-message classes (AppLocalizations) from the ARB
  # files in lib/l10n at build time. Configured by l10n.yaml.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled ringtone library (58 categorized tones). The whole directory is
  # declared so every `assets/sounds/rise_<n>.ogg` ships. Each tone is previewed
  # in the Create/Edit sound picker via just_audio; the native ring players map
  # the same tone to a platform resource (Android R.raw.rise_<n>, iOS bundled
  # UNNotificationSound) and fall back to the default on any miss.
  assets:
    - assets/sounds/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Light.ttf
          weight: 300
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600

# Brand launcher icon. Source PNGs are produced reproducibly by
# `dart run tool/gen_icon.dart`; the platform assets are then generated with
# `dart run flutter_launcher_icons`. Android uses an adaptive icon: a solid
# near-black brand background (#18181B, RiseColors.primary) behind the sunrise
# foreground; iOS uses the flattened master icon (no alpha).
flutter_launcher_icons:
  image_path: "assets/icon/rise_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#18181B"
  min_sdk_android: 21
  adaptive_icon_background: "#18181B"
  adaptive_icon_foreground: "assets/icon/rise_icon_foreground.png"
